<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Octavius Control</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { max-width: 34rem; margin: 0 auto; padding: 1.25rem; background: #10151a; color: #ecf3f6; }
      h1 { margin-bottom: 0; }
      p { color: #b6c5ca; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; }
      button { min-height: 3.5rem; border: 0; border-radius: .75rem; background: #197d75; color: white; font-size: 1rem; font-weight: 700; }
      button:active { background: #0e554f; transform: scale(.98); }
      .danger { background: #9d3535; }
      .command-row { display: flex; gap: .5rem; margin: 1rem 0; }
      input { min-width: 0; flex: 1; border: 1px solid #50636a; border-radius: .5rem; background: #1b252a; color: white; padding: .75rem; font-size: 1rem; }
      .send { min-height: auto; padding: .75rem 1rem; }
      code { color: #9ee7dc; }
      #status { min-height: 1.5rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>Octavius</h1>
    <p>One-arm control panel</p>

    <div class="grid">
      <button data-command="YAW_LEFT">Yaw left</button>
      <button data-command="YAW_RIGHT">Yaw right</button>
      <button data-command="PITCH_UP">Pitch up</button>
      <button data-command="PITCH_DOWN">Pitch down</button>
      <button data-command="CLAW_OPEN">Open claw</button>
      <button class="danger" data-command="CLAW_CLOSE">Close claw</button>
      <button data-command="WAVE">Wave</button>
      <button data-command="HOME">Home</button>
      <button data-command="STOP">Stop yaw</button>
    </div>

    <p>Or type a command:</p>
    <div class="command-row">
      <input id="command" list="command-list" placeholder="YAW_LEFT, PITCH_UP, CLAW_OPEN" autocomplete="off">
      <button class="send" id="send">Send</button>
    </div>
    <datalist id="command-list">
      <option value="YAW_LEFT">
      <option value="YAW_RIGHT">
      <option value="YAW_LEFT 250">
      <option value="YAW_RIGHT 250">
      <option value="PITCH_UP">
      <option value="PITCH_DOWN">
      <option value="PITCH_ANGLE 90">
      <option value="CLAW_OPEN">
      <option value="CLAW_CLOSE">
      <option value="CLAW_ANGLE 55">
      <option value="WAVE">
      <option value="HOME">
      <option value="STOP">
    </datalist>

    <p>Examples: <code>YAW_LEFT 250</code>, <code>PITCH_ANGLE 95</code>, <code>CLAW_ANGLE 55</code></p>
    <p id="status" aria-live="polite">Connecting…</p>

    <script>
      const status = document.querySelector('#status');
      const commandInput = document.querySelector('#command');

      async function sendCommand(command) {
        status.textContent = `Sending ${command}…`;
        try {
          const response = await fetch('/command', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command })
          });
          const result = await response.json();
          status.textContent = response.ok
            ? `${result.command}: ${result.nano_response || 'sent'}`
            : result.error;
        } catch (error) {
          status.textContent = `Connection error: ${error.message}`;
        }
      }

      document.querySelectorAll('[data-command]').forEach((button) => {
        button.addEventListener('click', () => sendCommand(button.dataset.command));
      });

      document.querySelector('#send').addEventListener('click', () => {
        if (commandInput.value.trim()) sendCommand(commandInput.value);
      });

      commandInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && commandInput.value.trim()) {
          sendCommand(commandInput.value);
        }
      });

      fetch('/health')
        .then(() => { status.textContent = 'Ready'; })
        .catch(() => { status.textContent = 'Pi is not responding'; });
    </script>
  </body>
</html>
